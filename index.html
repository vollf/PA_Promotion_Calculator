<body>
    <div class="container">

                    <div class="option-item">
                        <input type="radio" id="act1-5000-400" name="activity1" value="5000-400">

                    <div class="option-item">
                        <input type="radio" id="act1-5000-500" name="activity1" value="5000-500">

                    </div>
                    <div class="option-item">
                        <input type="radio" id="act1-10000-500" name="activity1" value="10000-500">
                        <label for="act1-10000-500">每满10000赠500</label>
                    </div>
                    <div class="option-item">
                        <input type="radio" id="act1-10000-600" name="activity1" value="10000-600">
                        <label for="act1-10000-600">每满10000赠600</label>
                    </div>
                    <div class="option-item">
                        <input type="radio" id="act1-10000-800" name="activity1" value="10000-800">
                        <label for="act1-10000-800">每满10000赠800</label>
                    </div>
                    <div class="option-item">
                        <input type="radio" id="act1-10000-1000" name="activity1" value="10000-1000">
                        <label for="act1-10000-1000">每满10000赠1000</label>
                    </div>
                </div>
            </div>
            
            <div class="activity-options">
                <h3>活动2：积分倍数活动</h3>
                <div class="options-grid" id="activity2-options">
                    <div class="option-item">
                        <input type="radio" id="act2-none" name="activity2" value="none" checked="">
                        <label for="act2-none">不参加</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="no">
                        <input type="radio" id="act2-no-5x" name="activity2" value="no-5x">
                        <label for="act2-no-5x">无门槛享5倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="no">
                        <input type="radio" id="act2-no-8x" name="activity2" value="no-8x">
                        <label for="act2-no-8x">无门槛享8倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="no">
                        <input type="radio" id="act2-no-10x" name="activity2" value="no-10x">
                        <label for="act2-no-10x">无门槛享10倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="no">
                        <input type="radio" id="act2-no-20x" name="activity2" value="no-20x">
                        <label for="act2-no-20x">无门槛享20倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="1000">
                        <input type="radio" id="act2-1000-5x" name="activity2" value="1000-5x">
                        <label for="act2-1000-5x">满1000享5倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="1000">
                        <input type="radio" id="act2-1000-10x" name="activity2" value="1000-10x">
                        <label for="act2-1000-10x">满1000享10倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="1000">
                        <input type="radio" id="act2-1000-20x" name="activity2" value="1000-20x">
                        <label for="act2-1000-20x">满1000享20倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="2000">
                        <input type="radio" id="act2-2000-5x" name="activity2" value="2000-5x">
                        <label for="act2-2000-5x">满2000享5倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="2000">
                        <input type="radio" id="act2-2000-10x" name="activity2" value="2000-10x">
                        <label for="act2-2000-10x">满2000享10倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="2000">
                        <input type="radio" id="act2-2000-20x" name="activity2" value="2000-20x">
                        <label for="act2-2000-20x">满2000享20倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="3000">
                        <input type="radio" id="act2-3000-10x" name="activity2" value="3000-10x">
                        <label for="act2-3000-10x">满3000享10倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="3000">
                        <input type="radio" id="act2-3000-15x" name="activity2" value="3000-15x">
                        <label for="act2-3000-15x">满3000享15倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="4000">
                        <input type="radio" id="act2-4000-20x" name="activity2" value="4000-20x">
                        <label for="act2-4000-20x">满4000享20倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="10000">
                        <input type="radio" id="act2-10000-10x" name="activity2" value="10000-10x">
                        <label for="act2-10000-10x">满10000享10倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="50000">
                        <input type="radio" id="act2-50000-2x" name="activity2" value="50000-2x">
                        <label for="act2-50000-2x">满50000享2倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="100000">
                        <input type="radio" id="act2-100000-3x" name="activity2" value="100000-3x">
                        <label for="act2-100000-3x">满100000享3倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="300000">
                        <input type="radio" id="act2-300000-5x" name="activity2" value="300000-5x">
                        <label for="act2-300000-5x">满300000享5倍积分</label>
                    </div>
                    <div class="option-item act2-option" data-threshold="500000">
                        <input type="radio" id="act2-500000-5x" name="activity2" value="500000-5x">
                        <label for="act2-500000-5x">满500000享5倍积分</label>
                    </div>
                </div>
            </div>
            
            <div class="checkbox-group">
                <h3>活动3：积分兑券方式</h3>
                <div class="checkbox-item">
                    <input type="checkbox" id="activity3-20000" checked="">
                    <label for="activity3-20000">20000积分兑100元券（每人限3张）</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="activity3-25000" checked="">
                    <label for="activity3-25000">25000积分兑100元券（不限量）</label>
                </div>
            </div>
            
            <button id="calculateBtn">计算最优方案</button>
        </div>
        
        <div id="result" class="result">
            <h2>计算结果</h2>
            <div class="result-item">
                <span>订单金额：</span>
                <span class="coupon-value" id="originalAmount">0</span>元
            </div>
            <div class="result-item">
                <span>实付金额：</span>
                <span class="coupon-value" id="paymentAmount">0</span>元
            </div>
            <div class="savings">
                节省金额：<span id="savingsAmount">0</span>元
            </div>
            
            <div class="coupon-details">
                <h3>优惠详情</h3>
                <div class="coupon-item">
                    <span>活动1赠券数量：</span>
                    <span class="coupon-value" id="coupon1Count">0</span>张（<span id="coupon1Value">0</span>元）
                </div>
                <div class="coupon-item">
                    <span>活动3（20000积分兑100）券数量：</span>
                    <span class="coupon-value" id="coupon3aCount">0</span>张（<span id="coupon3aValue">0</span>元）
                </div>
                <div class="coupon-item">
                    <span>活动3（25000积分兑100）券数量：</span>
                    <span class="coupon-value" id="coupon3bCount">0</span>张（<span id="coupon3bValue">0</span>元）
                </div>
                <div class="coupon-item">
                    <span>获得积分：</span>
                    <span class="coupon-value" id="pointsEarned">0</span>分
                </div>
            </div>
        </div>

    <script>
        // 页面加载时初始化活动2选项
        document.addEventListener('DOMContentLoaded', function() {
            updateActivity2Options();
            
            // 添加活动1选项变化监听
            document.querySelectorAll('input[name="activity1"]').forEach(radio => {
                radio.addEventListener('change', updateActivity2Options);
            });
        });
        
        // 更新活动2选项显示
        function updateActivity2Options() {
            const selectedAct1 = document.querySelector('input[name="activity1"]:checked').value;
            const act2Options = document.querySelectorAll('.act2-option');
            
            // 获取活动1的门槛值
            let threshold = 'none';
            if (selectedAct1 !== 'none') {
                threshold = selectedAct1.split('-')[0]; // 获取门槛值，如"1000"
            }
            
            // 显示或隐藏活动2选项
            act2Options.forEach(option => {
                const optionThreshold = option.getAttribute('data-threshold');
                
                if (selectedAct1 === 'none') {
                    // 如果活动1选择"不参加"，显示所有活动2选项
                    option.classList.remove('hidden');
                } else if (optionThreshold === threshold || optionThreshold === 'no') {
                    // 显示与活动1相同门槛或无门槛的选项
                    option.classList.remove('hidden');
                } else {
                    // 隐藏其他选项
                    option.classList.add('hidden');
                    
                    // 如果当前选中的活动2选项被隐藏，则选择"不参加"
                    const input = option.querySelector('input');
                    if (input.checked) {
                        document.getElementById('act2-none').checked = true;
                    }
                }
            });
        }
        
        document.getElementById('calculateBtn').addEventListener('click', function() {
            // 获取输入值
            const orderAmount = parseInt(document.getElementById('orderAmount').value);
            
            // 获取活动1选择
            const act1Value = document.querySelector('input[name="activity1"]:checked').value;
            
            // 获取活动2选择
            const act2Value = document.querySelector('input[name="activity2"]:checked').value;
            
            // 获取活动3选择
            const act3_20000 = document.getElementById('activity3-20000').checked;
            const act3_25000 = document.getElementById('activity3-25000').checked;
            
            if (isNaN(orderAmount) || orderAmount <= 0) {
                alert('请输入有效的订单金额');
                return;
            }
            
            // 计算最优方案
            const result = calculateOptimalPayment(
                orderAmount, 
                act1Value, 
                act2Value, 
                act3_20000, 
                act3_25000
            );
            
            // 显示结果
            document.getElementById('originalAmount').textContent = orderAmount;
            document.getElementById('paymentAmount').textContent = result.payment;
            document.getElementById('savingsAmount').textContent = orderAmount - result.payment;
            document.getElementById('coupon1Count').textContent = result.coupon1Count;
            document.getElementById('coupon1Value').textContent = result.coupon1Value;
            document.getElementById('coupon3aCount').textContent = result.coupon3aCount;
            document.getElementById('coupon3aValue').textContent = result.coupon3aCount * 100;
            document.getElementById('coupon3bCount').textContent = result.coupon3bCount;
            document.getElementById('coupon3bValue').textContent = result.coupon3bCount * 100;
            document.getElementById('pointsEarned').textContent = result.pointsEarned;
            
            document.getElementById('result').style.display = 'block';
        });
        
        function calculateOptimalPayment(S, act1, act2, act3_20000, act3_25000) {
            // 如果没有选择任何活动
            if (act1 === 'none' && act2 === 'none' && !act3_20000 && !act3_25000) {
                return {
                    payment: S,
                    coupon1Count: 0,
                    coupon1Value: 0,
                    coupon3aCount: 0,
                    coupon3bCount: 0,
                    pointsEarned: 0
                };
            }
            
            let bestPayment = S;
            let bestCoupon1Count = 0;
            let bestCoupon1Value = 0;
            let bestCoupon3aCount = 0;
            let bestCoupon3bCount = 0;
            let bestPoints = 0;
            
            // 从订单金额开始递减尝试，寻找最优解
            for (let P = S; P >= 0; P -= 100) {
                // 计算活动1赠券
                let coupon1Count = 0;
                let coupon1Value = 0;
                
                if (act1 !== 'none') {
                    const [threshold, coupon] = act1.split('-').map(Number);
                    coupon1Count = Math.floor(P / threshold);
                    coupon1Value = coupon1Count * coupon;
                }
                
                // 计算活动2积分
                let pointsEarned = 0;
                
                // 修改点：当活动2选择"不参加"时，默认为1倍积分
                if (act2 === 'none') {
                    pointsEarned = P; // 1倍积分
                } else {
                    if (act2.startsWith('no-')) {
                        // 无门槛积分
                        const multiple = parseInt(act2.split('-')[1].replace('x', ''));
                        pointsEarned = P * multiple;
                    } else {
                        // 有门槛积分
                        const [thresholdStr, multipleStr] = act2.split('-');
                        const threshold = parseInt(thresholdStr);
                        const multiple = parseInt(multipleStr.replace('x', ''));
                        
                        if (P >= threshold) {
                            pointsEarned = P * multiple;
                        }
                        // 如果未达到门槛，积分保持不变（默认为1倍积分）
                        else {
                            pointsEarned = P; // 1倍积分
                        }
                    }
                }
                
                // 计算活动3兑券
                let coupon3aCount = 0;
                let coupon3bCount = 0;
                let remainingPoints = pointsEarned;
                
                if (act3_20000) {
                    // 先兑换20000积分券（最多3张）
                    coupon3aCount = Math.min(3, Math.floor(remainingPoints / 20000));
                    remainingPoints -= coupon3aCount * 20000;
                }
                
                if (act3_25000) {
                    // 再兑换25000积分券
                    coupon3bCount = Math.floor(remainingPoints / 25000);
                }
                
                const coupon3Value = (coupon3aCount + coupon3bCount) * 100;
                
                // 计算总金额
                const totalAmount = P + coupon1Value + coupon3Value;
                
                // 确保不低于订单金额
                if (totalAmount >= S) {
                    bestPayment = P;
                    bestCoupon1Count = coupon1Count;
                    bestCoupon1Value = coupon1Value;
                    bestCoupon3aCount = coupon3aCount;
                    bestCoupon3bCount = coupon3bCount;
                    bestPoints = pointsEarned;
                    
                    // 如果等于订单金额，提前结束
                    if (totalAmount === S) {
                        break;
                    }
                } else {
                    // 如果已经小于订单金额，停止搜索
                    break;
                }
            }
            
            return {
                payment: bestPayment,
                coupon1Count: bestCoupon1Count,
                coupon1Value: bestCoupon1Value,
                coupon3aCount: bestCoupon3aCount,
                coupon3bCount: bestCoupon3bCount,
                pointsEarned: bestPoints
            };
        }
    </script>
